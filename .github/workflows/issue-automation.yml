name: Issue Automation

on:
  issues:
    types: [opened, assigned, reopened]

concurrency:
  group: issue-automation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  number-issue:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process issue title and assign labels
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # Map prefix aliases to determine labels and branch prefix
          RAW_PREFIX=$(echo "$ISSUE_TITLE" | awk '{print tolower($1)}')
          case "$RAW_PREFIX" in
            fix)
              LABEL="bug"; BRANCH_PREFIX="bugfix";;
            bug)
              LABEL="bug"; BRANCH_PREFIX="bugfix";;
            feature)
              LABEL="feature"; BRANCH_PREFIX="feature";;
            proposal)
              LABEL="proposal"; BRANCH_PREFIX="feature";;
            enhancement)
              LABEL="feature"; BRANCH_PREFIX="feature";;
            *)
              LABEL="feature"; BRANCH_PREFIX="feature";;
          esac

          # Add label to the issue
          gh issue edit "${{ github.event.issue.number }}" --add-label "$LABEL"

          # Clean the title by removing any prefix
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed -E "s/^($RAW_PREFIX)//i" | sed 's/^: *//;s/^ *//;s/ *$//')

          # Update title with KMN-{issue_number} prefix
          NEW_TITLE="KMN-${{ github.event.issue.number }}: $CLEAN_TITLE"
          echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV

          # Apply the new title to the issue
          gh issue edit "${{ github.event.issue.number }}" --title "$NEW_TITLE"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  create-branch:
    if: github.event.action == 'assigned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process issue title and set variables
        id: process_title
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # Extract KMN number from title or use GitHub issue number
          if echo "$ISSUE_TITLE" | grep -q "^KMN-[0-9]\+"; then
            KMN_NUMBER=$(echo "$ISSUE_TITLE" | sed 's/^KMN-\([0-9]\+\).*/\1/')
            echo "KMN_NUMBER=$KMN_NUMBER" >> $GITHUB_ENV
          else
            KMN_NUMBER="${{ github.event.issue.number }}"
            echo "KMN_NUMBER=$KMN_NUMBER" >> $GITHUB_ENV
          fi

          # Determine branch prefix based on the title
          RAW_PREFIX=$(echo "$ISSUE_TITLE" | awk '{print tolower($1)}')
          case "$RAW_PREFIX" in
            fix|bug)
              BRANCH_PREFIX="bugfix";;
            proposal|feature|enhancement)
              BRANCH_PREFIX="feature";;
            *)
              BRANCH_PREFIX="feature";;
          esac

          echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV

          # Clean the title and prepare a slugged version for the branch name
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/KMN-[0-9]*: *//' | sed -E 's/^($RAW_PREFIX)//i' | sed 's/^ *//;s/ *$//')
          SLUGGED_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]' | tr -s '[:punct:]' '-' | tr ' ' '-')

          echo "SLUGGED_TITLE=$SLUGGED_TITLE" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create a new branch based on the issue number
        run: |
          BRANCH_NAME="${{ env.BRANCH_PREFIX }}/KMN-${{ env.KMN_NUMBER }}-${{ env.SLUGGED_TITLE }}"

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, skipping"
          else
            git checkout -b "$BRANCH_NAME"
            git push --set-upstream origin "$BRANCH_NAME"
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Link branch to issue
        if: env.BRANCH_NAME != ''
        run: |
          REPO="${{ github.repository }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          BRANCH_NAME="${{ env.BRANCH_NAME }}"
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER" \
            -d "{\"branch\": \"$BRANCH_NAME\"}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add branch link to issue
        if: env.BRANCH_NAME != ''
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_URL="${REPO_URL}/tree/${{ env.BRANCH_NAME }}"
          gh issue comment "${{ github.event.issue.number }}" --body "Created and linked branch: [$BRANCH_NAME]($BRANCH_URL) for assignee @${{ github.event.assignee.login }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
