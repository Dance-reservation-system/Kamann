name: Issue Automation
on:
  issues:
    types: [opened, assigned, reopened]

concurrency:
  group: issue-automation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  number-issue:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Process issue title and assign labels
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # Extract potential prefix (case-insensitive) from the start
          RAW_PREFIX=$(echo "$ISSUE_TITLE" | grep -oE '^[a-zA-Z]+' | tr '[:upper:]' '[:lower:]' || echo "")

          # Map prefix to label and branch prefix
          case "$RAW_PREFIX" in
            fix|bug)
              LABEL="bug"; BRANCH_PREFIX="bugfix";;
            feature|enhancement)
              LABEL="feature"; BRANCH_PREFIX="feature";;
            proposal)
              LABEL="proposal"; BRANCH_PREFIX="feature";;
            *)
              LABEL="feature"; BRANCH_PREFIX="feature";;
          esac

          # Add label to the issue
          gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL"

          # Clean the title by removing the prefix
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed -E "s/^[[:space:]]*${RAW_PREFIX}[[:space:]]*[:]*[[:space:]]*//i" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # Update title with KMN-{issue_number} prefix
          NEW_TITLE="KMN-$ISSUE_NUMBER: $CLEAN_TITLE"
          echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
          echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV

          # Apply the new title to the issue
          gh issue edit "$ISSUE_NUMBER" --title "$NEW_TITLE"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add initial comment
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Issue processed and titled as ${{ env.NEW_TITLE }}. Awaiting assignment for branch creation."
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  create-branch:
    if: github.event.action == 'assigned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process issue title and set variables
        id: process_title
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # Extract KMN number from title or use GitHub issue number
          if echo "$ISSUE_TITLE" | grep -q "^KMN-[0-9]\+"; then
            KMN_NUMBER=$(echo "$ISSUE_TITLE" | sed 's/^KMN-\([0-9]\+\).*/\1/')
          else
            KMN_NUMBER="$ISSUE_NUMBER"
            NEW_TITLE="KMN-$KMN_NUMBER: $ISSUE_TITLE"
            gh issue edit "$ISSUE_NUMBER" --title "$NEW_TITLE"
          fi
          echo "KMN_NUMBER=$KMN_NUMBER" >> $GITHUB_ENV

          # Extract potential prefix (case-insensitive)
          RAW_PREFIX=$(echo "$ISSUE_TITLE" | grep -oE '^[a-zA-Z]+' | tr '[:upper:]' '[:lower:]' || echo "")

          # Determine branch prefix and label
          case "$RAW_PREFIX" in
            fix|bug)
              BRANCH_PREFIX="bugfix"; LABEL="bug";;
            feature|enhancement|proposal)
              BRANCH_PREFIX="feature"; LABEL="feature";;
            *)
              BRANCH_PREFIX="feature"; LABEL="feature";;
          esac
          echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV

          # Ensure the label is applied (in case it was missed or changed)
          gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL,todo"

          # Clean the title and prepare a slugged version
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/KMN-[0-9]*: *//' | sed -E "s/^[[:space:]]*${RAW_PREFIX}[[:space:]]*[:]*[[:space:]]*//i" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          SLUGGED_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]' | tr -s '[:punct:]' '-' | tr ' ' '-')
          echo "SLUGGED_TITLE=$SLUGGED_TITLE" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create a new branch based on the issue number
        run: |
          BRANCH_NAME="${{ env.BRANCH_PREFIX }}/KMN-${{ env.KMN_NUMBER }}-${{ env.SLUGGED_TITLE }}"

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, skipping"
          else
            git checkout -b "$BRANCH_NAME"
            git push --set-upstream origin "$BRANCH_NAME"
            echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Link branch to issue
        if: env.BRANCH_NAME != ''
        run: |
          REPO="${{ github.repository }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          BRANCH_NAME="${{ env.BRANCH_NAME }}"
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER" \
            -d "{\"branch\": \"$BRANCH_NAME\"}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add branch link to issue
        if: env.BRANCH_NAME != ''
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_URL="${REPO_URL}/tree/${{ env.BRANCH_NAME }}"
          gh issue comment "$ISSUE_NUMBER" --body "Created and linked branch: [$BRANCH_NAME]($BRANCH_URL) for assignee @${{ github.event.assignee.login }}. Work can now begin!"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Notify assignee
        if: env.BRANCH_NAME != ''
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "@${{ github.event.assignee.login }}, you've been assigned to this issue. Branch [$BRANCH_NAME] is ready for your changes."
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
