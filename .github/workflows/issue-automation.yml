name: Issue Automation
on:
  issues:
    types: [opened, assigned]

concurrency:
  group: issue-automation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  number-issue:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize issue number file if not exists
        run: |
          if [ ! -f .github/ISSUE_NUMBER.txt ]; then
            mkdir -p .github
            echo "1" > .github/ISSUE_NUMBER.txt
          fi

      - name: Read current issue number
        id: issue_number
        run: |
          CURRENT_NUMBER=$(cat .github/ISSUE_NUMBER.txt)
          echo "CURRENT_NUMBER=$CURRENT_NUMBER" >> $GITHUB_ENV

      - name: Process issue title and assign labels
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          
          # Assign labels based on the issue title
          if echo "$ISSUE_TITLE" | grep -iq "feature"; then
            echo "Assigning 'feature' label"
            gh issue edit "${{ github.event.issue.number }}" --add-label "feature"
            BRANCH_PREFIX="feature"
          elif echo "$ISSUE_TITLE" | grep -iq "bug"; then
            echo "Assigning 'bugfix' label"
            gh issue edit "${{ github.event.issue.number }}" --add-label "bugfix"
            BRANCH_PREFIX="bugfix"
          else
            echo "No label matched, skipping label assignment"
            BRANCH_PREFIX="feature"  # Default if no label matches
          fi

          # Update the issue title with the correct number
          NEW_TITLE="KMN-${CURRENT_NUMBER}: $ISSUE_TITLE"
          NEXT_NUMBER=$((CURRENT_NUMBER + 1))
          gh issue edit "${{ github.event.issue.number }}" --title "$NEW_TITLE"
          echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
          echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV
          echo "NEXT_NUMBER=$NEXT_NUMBER" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push updated number
        if: env.NEXT_NUMBER != env.CURRENT_NUMBER
        run: |
          echo ${{ env.NEXT_NUMBER }} > .github/ISSUE_NUMBER.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_NUMBER.txt
          git commit -m "Increment issue number to ${{ env.NEXT_NUMBER }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  create-branch:
    if: github.event.action == 'assigned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read current issue number
        id: issue_number
        run: |
          CURRENT_NUMBER=$(cat .github/ISSUE_NUMBER.txt)
          echo "CURRENT_NUMBER=$CURRENT_NUMBER" >> $GITHUB_ENV

      - name: Process issue title and set variables
        id: process_title
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"

          # Check if it's a proposal and skip branch creation
          if echo "$ISSUE_TITLE" | grep -iq "^proposal"; then
            echo "Issue is a proposal, adding 'Proposal' label and skipping branch creation"
            gh issue edit "${{ github.event.issue.number }}" --add-label "Proposal"
            
            # Don't change the title for proposals, and don't increment the number
            NEW_TITLE="$ISSUE_TITLE"
            BRANCH_PREFIX="proposal"
            echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
            echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV
            exit 0  # Skip further steps, no branch creation, no increment
          fi

          # If not a proposal, continue with bugfix/feature logic
          if echo "$ISSUE_TITLE" | grep -iq "bug"; then
            BRANCH_PREFIX="bugfix"
          else
            BRANCH_PREFIX="feature"
          fi

          # Format the branch name and slugged title
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/KMN-[0-9]*: *//')
          SLUGGED_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]' | tr -s '[:punct:]' '-' | tr ' ' '-')

          NEW_TITLE="KMN-${CURRENT_NUMBER}: $ISSUE_TITLE"
          KMN_NUMBER="$CURRENT_NUMBER"
          NEXT_NUMBER=$((CURRENT_NUMBER + 1))

          echo "BRANCH_PREFIX=$BRANCH_PREFIX" >> $GITHUB_ENV
          echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
          echo "KMN_NUMBER=$KMN_NUMBER" >> $GITHUB_ENV
          echo "SLUGGED_TITLE=$SLUGGED_TITLE" >> $GITHUB_ENV
          echo "NEXT_NUMBER=$NEXT_NUMBER" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit and push updated number
        if: env.NEXT_NUMBER != env.CURRENT_NUMBER
        run: |
          echo ${{ env.NEXT_NUMBER }} > .github/ISSUE_NUMBER.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_NUMBER.txt
          git commit -m "Increment issue number to ${{ env.NEXT_NUMBER }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create a new branch based on the current issue number
        run: |
          # Only create branch if it's not a proposal
          if [[ "${{ env.BRANCH_PREFIX }}" != "proposal" ]]; then
            BRANCH_NAME="${BRANCH_PREFIX}/KMN-${{ env.KMN_NUMBER }}-${{ env.SLUGGED_TITLE }}"

            # Check if the branch already exists
            if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
              echo "Branch $BRANCH_NAME already exists, skipping"
            else
              git checkout -b "$BRANCH_NAME"
              git push --set-upstream origin "$BRANCH_NAME"
              echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add branch link to issue
        if: steps.create_branch.outputs.stdout != 'Branch already exists'
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_URL="${REPO_URL}/tree/${{ env.BRANCH_NAME }}"
          gh issue comment "${{ github.event.issue.number }}" --body "Created branch: [$BRANCH_NAME]($BRANCH_URL) for assignee @${{ github.event.assignee.login }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
