name: Auto-number Issues and Create Branches
on:
  issues:
    types: [opened, assigned]

jobs:
  number-issue:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize issue number file if not exists
        run: |
          if [ ! -f .github/ISSUE_NUMBER.txt ]; then
            mkdir -p .github
            echo "1" > .github/ISSUE_NUMBER.txt
          fi

      - name: Read current issue number
        id: issue_number
        run: |
          CURRENT_NUMBER=$(cat .github/ISSUE_NUMBER.txt)
          echo "CURRENT_NUMBER=$CURRENT_NUMBER" >> $GITHUB_ENV

      - name: Update issue title with KMN number
        run: |
          gh issue edit "${{ github.event.issue.number }}" --title "KMN-${CURRENT_NUMBER}: ${{ github.event.issue.title }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Increment issue number
        run: |
          NEXT_NUMBER=$((CURRENT_NUMBER + 1))
          echo $NEXT_NUMBER > .github/ISSUE_NUMBER.txt
          echo "NEXT_NUMBER=$NEXT_NUMBER" >> $GITHUB_ENV

      - name: Commit and push updated number
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_NUMBER.txt
          git commit -m "Increment issue number to $NEXT_NUMBER"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  create-branch:
    if: github.event.action == 'assigned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract KMN number and clean title
        id: extract
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          KMN_NUMBER=$(echo "$ISSUE_TITLE" | grep -o 'KMN-[0-9]*' | cut -d'-' -f2)
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/KMN-[0-9]*: *//')
          SLUGGED_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]' | tr -s '[:punct:]' '-' | tr ' ' '-')
          echo "KMN_NUMBER=$KMN_NUMBER" >> $GITHUB_ENV
          echo "SLUGGED_TITLE=$SLUGGED_TITLE" >> $GITHUB_ENV

      - name: Create a new branch based on the issue number
        run: |
          BRANCH_NAME="KMN-${{ env.KMN_NUMBER }}-${{ env.SLUGGED_TITLE }}"
          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Add branch link to issue
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH_URL="${REPO_URL}/tree/${{ env.BRANCH_NAME }}"
          gh issue comment "${{ github.event.issue.number }}" --body "Created branch: [$BRANCH_NAME]($BRANCH_URL) for assignee @${{ github.event.assignee.login }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
